<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Border -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="5" />

  <!-- Background Data Grid / Circuit Traces -->
  <g opacity="0.25">
    <path d="M 80 160 L 180 160 L 210 200" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
    <path d="M 432 352 L 332 352 L 302 312" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
    <circle cx="80" cy="160" r="8" fill="#06b6d4" />
    <circle cx="432" cy="352" r="8" fill="#8b5cf6" />
  </g>

  <!-- Autonomous Gear Structure -->
  <g transform="translate(256, 256)">
    <!-- 8 Gear Cogs -->
    <g fill="url(#ringGrad)">
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" />
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" transform="rotate(45)" />
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" transform="rotate(90)" />
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" transform="rotate(135)" />
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" transform="rotate(180)" />
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" transform="rotate(225)" />
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" transform="rotate(270)" />
      <path d="M -32 -180 L 32 -180 L 26 -142 L -26 -142 Z" transform="rotate(315)" />
    </g>

    <!-- Outer Gear Ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="24" />
    <circle cx="0" cy="0" r="122" fill="#090d16" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

    <!-- Autonomous Multi-Agent Triad Nodes -->
    <g filter="url(#neon)">
      <!-- Connecting Workflow Lines -->
      <path d="M 0 -76 L 66 38 L -66 38 Z" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linejoin="round" />
      
      <!-- Triad Nodes -->
      <circle cx="0" cy="-76" r="24" fill="#06b6d4" />
      <circle cx="66" cy="38" r="24" fill="#3b82f6" />
      <circle cx="-66" cy="38" r="24" fill="#8b5cf6" />

      <!-- Inner Glow Nodes -->
      <circle cx="0" cy="-76" r="10" fill="#ffffff" />
      <circle cx="66" cy="38" r="10" fill="#ffffff" />
      <circle cx="-66" cy="38" r="10" fill="#ffffff" />

      <!-- Center Spark Core (Execution Engine) -->
      <circle cx="0" cy="0" r="30" fill="url(#coreGrad)" />
      <polygon points="0,-18 6,-6 18,-6 9,3 13,15 0,8 -13,15 -9,3 -18,-6 -6,-6" fill="#ffffff" />
    </g>
  </g>
</svg>
